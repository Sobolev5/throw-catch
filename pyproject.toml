[project]
name = "throw-catch"
version = "0.3.0"
description = "RabbitMQ throw & catch messages"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Andrey Sobolev", email = "email.asobolev@gmail.com" },
]
dependencies = [
    "orjson>=3.8,<4.0",
    "pika>=1.3,<2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Sobolev5/throw-catch/"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.10,<4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["throw_catch"]
